version: 2
updates:
  # Keep GitHub Actions pinned versions current. This is what would have
  # surfaced the actions/checkout + upload-artifact Node 20 deprecation
  # automatically instead of us catching it by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  # JavaScript/TypeScript dependencies (Bun workspace, bun.lock).
  # Version updates are off (limit 0): we update every package together
  # locally and land it as one tested PR, see
  # docs/guides/dependency-updates.md. Security updates are not affected
  # by this limit and still open their own PRs.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Pinned: the tree-sitter-wasms grammars are built for the 0.20 ABI and
      # newer web-tree-sitter extracts no symbols from them (d63c68829).
      - dependency-name: web-tree-sitter
