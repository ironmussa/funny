name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege token: CI jobs only need to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref so quick successive pushes don't
# pile up duplicate CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for deterministic CI — bump deliberately, not via "latest".
          bun-version: 1.4.4

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # remote-connector's Rust lint links libdbus-sys (keyring), which needs dbus-1 via pkg-config.
      - name: Install system libraries (remote-connector)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      # `lint` ends with `cargo clippy` on remote-connector (~300 crates):
      # without a cache it compiled them all from scratch on every run.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies (remote-connector)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/remote-connector

      - name: Lint (oxlint)
        run: bun run lint

      # The evflow viewer is not a workspace: it has its own lockfile and Tailwind.
      # oxfmt sorts its Tailwind classes against that install, so without it the
      # check expects a different class order than local runs produce.
      - name: Install evflow viewer dependencies (Tailwind class sorting)
        run: bun install --frozen-lockfile --cwd packages/evflow/viewer

      - name: Format check (oxfmt)
        run: bun run format:check

  # Split by package so the suites run in parallel instead of one after another.
  # Each shard installs its own dependencies (cached) and only the system
  # libraries and native builds it needs.
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core
            native-git: true
          - shard: runtime
            native-git: true
          - shard: server
          - shard: client
            gpuix-libs: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The renderer benchmark loads the GPUIX native addon, which links libxkbcommon-x11.
      - name: Install system libraries (GPUIX native)
        if: matrix.gpuix-libs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-0

      - name: Install Rust stable
        if: matrix.native-git
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies (native-git)
        if: matrix.native-git
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-git

      # core runs the native/CLI parity suites; runtime tests the gitoxide paths.
      - name: Build native-git
        if: matrix.native-git
        run: bun run build:native

      - name: Test typecheck baseline runner
        if: matrix.shard == 'core'
        run: bun test scripts/fitness/check-typecheck.test.ts

      - name: Test the suite runner's git isolation
        if: matrix.shard == 'core'
        run: bun test scripts/__tests__/test-env.test.ts

      - name: Run tests (shared)
        if: matrix.shard == 'core'
        run: bun run --cwd packages/shared test

      - name: Run tests (core)
        if: matrix.shard == 'core'
        run: bun run --cwd packages/core test

      - name: Run tests (agent)
        if: matrix.shard == 'core'
        run: bun run --cwd packages/agent test

      - name: Run tests (runtime)
        if: matrix.shard == 'runtime'
        run: bun run --cwd packages/runtime test

      # The coverage gate runs the full server suite (bun test --coverage
      # --isolate) and fails on any test failure, so a separate plain run
      # would execute every server test twice.
      - name: Run tests with coverage gate (server)
        if: matrix.shard == 'server'
        run: bun run --cwd packages/server test:coverage:gate

      # Same suite as `test`, plus coverage: one run instead of two.
      - name: Run tests with coverage (client)
        if: matrix.shard == 'client'
        run: bun run --cwd packages/client test:coverage

      - name: Run renderer benchmark contract smoke
        if: matrix.shard == 'client'
        run: bun run test:renderer-benchmark

  # CI did not type-check at all: only the pre-commit hook did.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `typecheck` also runs `cargo check` on remote-connector (libdbus-sys).
      - name: Install system libraries (remote-connector)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies (remote-connector)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/remote-connector

      - name: Typecheck
        run: bun run typecheck

  # Independent of the tests: building in parallel instead of after them.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  gpuix-contract:
    name: GPUIX contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GPUI renders through Vulkan. The runner has no GPU, so the release smoke
      # needs Mesa's software Vulkan driver (lavapipe) to create a surface.
      - name: Install system libraries (GPUIX native, Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libxkbcommon-x11-0 xvfb libvulkan1 mesa-vulkan-drivers

      - name: Run client-core contracts
        run: bun run --cwd packages/client-core test

      - name: Typecheck GPUIX UI primitives
        run: bun run --cwd packages/gpuix-ui typecheck

      - name: Require native GPUIX test renderer (macOS and Windows)
        if: runner.os != 'Linux'
        run: bun run --cwd packages/gpuix-ui verify:native-test-renderer

      - name: Run GPUIX UI contracts and compatible native tests
        run: bun run --cwd packages/gpuix-ui test

      - name: Run GPUIX product contracts and compatible native smoke
        run: bun run --cwd packages/client-gpuix test

      - name: Typecheck GPUIX product
        run: bun run --cwd packages/client-gpuix typecheck

      - name: Build GPUIX product
        run: bun run --cwd packages/client-gpuix build

      - name: Package GPUIX product
        run: bun run --cwd packages/client-gpuix package:release

      - name: Smoke GPUIX release (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run --cwd packages/client-gpuix smoke:release

      - name: Smoke GPUIX release (macOS and Windows)
        if: runner.os != 'Linux'
        run: bun run --cwd packages/client-gpuix smoke:release

      - name: Upload GPUIX release candidate
        uses: actions/upload-artifact@v7
        with:
          name: client-gpuix-${{ matrix.os }}-${{ runner.arch }}
          path: artifacts/*.tgz

  chrome-extension:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Chrome extension
        run: bun run --cwd packages/chrome-extension build

      - name: Package Chrome extension
        run: bun run --cwd packages/chrome-extension package

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: packages/chrome-extension/funny-annotator-*.zip
