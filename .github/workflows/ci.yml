name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege token: CI jobs only need to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref so quick successive pushes don't
# pile up duplicate CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for deterministic CI — bump deliberately, not via "latest".
          bun-version: 1.4.0

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies (native-git)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-git

      - name: Build native-git (for core parity tests)
        run: bun run build:native

      - name: Run tests (shared)
        run: bun run --cwd packages/shared test

      - name: Run tests (core)
        run: bun run --cwd packages/core test

      - name: Run tests (agent)
        run: bun run --cwd packages/agent test

      - name: Run tests (runtime)
        run: bun run --cwd packages/runtime test

      - name: Run tests (server)
        run: bun run --cwd packages/server test

      - name: Run server coverage gate
        run: bun run --cwd packages/server test:coverage:gate

      - name: Run tests (client)
        run: bun run --cwd packages/client test

      - name: Run renderer benchmark contract smoke
        run: bun run test:renderer-benchmark

      - name: Run client coverage (scoped logic layers)
        run: bun run --cwd packages/client test:coverage

  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

  gpuix-contract:
    name: GPUIX contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Run client-core contracts
        run: bun run --cwd packages/client-core test

      - name: Typecheck GPUIX UI primitives
        run: bun run --cwd packages/gpuix-ui typecheck

      - name: Require native GPUIX test renderer (macOS and Windows)
        if: runner.os != 'Linux'
        run: bun run --cwd packages/gpuix-ui verify:native-test-renderer

      - name: Run GPUIX UI contracts and compatible native tests
        run: bun run --cwd packages/gpuix-ui test

      - name: Run GPUIX product contracts and compatible native smoke
        run: bun run --cwd packages/client-gpuix test

      - name: Typecheck GPUIX product
        run: bun run --cwd packages/client-gpuix typecheck

      - name: Build GPUIX product
        run: bun run --cwd packages/client-gpuix build

      - name: Package GPUIX product
        run: bun run --cwd packages/client-gpuix package:release

      - name: Smoke GPUIX release (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run --cwd packages/client-gpuix smoke:release

      - name: Smoke GPUIX release (macOS and Windows)
        if: runner.os != 'Linux'
        run: bun run --cwd packages/client-gpuix smoke:release

      - name: Upload GPUIX release candidate
        uses: actions/upload-artifact@v7
        with:
          name: client-gpuix-${{ matrix.os }}-${{ runner.arch }}
          path: artifacts/*.tgz

  chrome-extension:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build Chrome extension
        run: bun run --cwd packages/chrome-extension build

      - name: Package Chrome extension
        run: bun run --cwd packages/chrome-extension package

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: packages/chrome-extension/funny-annotator-*.zip
