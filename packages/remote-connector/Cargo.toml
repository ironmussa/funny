[package]
name = "funny-remote-connector"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "funny-remote-connector"
path = "rust/src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive", "env"] }
ed25519-dalek = "2.2.0"
rand = "0.8.5"
regex = "1.12.3"
rsa = { version = "0.9.10", features = ["sha2"] }
russh = { version = "0.62.4", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.27"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.19"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "socket", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.1.0", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
