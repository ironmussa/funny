[package]
name = "funny-runner-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
prost = "0.14.1"
prost-types = "0.14.1"
tonic = { version = "0.14.2", default-features = false, features = ["codegen", "transport", "tls-ring"] }
tonic-prost = "0.14.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
