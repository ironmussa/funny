# Built-in flow of the server-run issue factory for repositories that merge by
# hand (change factory-flow-execution, factory-quality-gates): implement an
# issue, open a pull request, prove the regression test, then stop. The run
# ends `waiting_human` with the pull request and the proof for a person to
# review and merge. `issue-to-merge` is the same flow plus the CI fix loop
# and the merge.
#
# The server runs this flow as the factory's enabler: the agent step is a
# thread on the enabler's runner, the agent commits, pushes and opens the
# pull request, and the `pull-request` step finds it on GitHub by its branch.
# The `regression-proof` step runs the changed test files against the base
# and the head to prove the fix.
#
# To customize per repository, copy this file to
# `.funny/workflows/issue-to-pr.yaml` on the DEFAULT branch and edit it, keeping
# the inputs. A copy on any other branch is ignored.

name: issue-to-pr
description: Implement a GitHub issue, open a pull request and prove the regression test for a person to merge

inputs:
  repo: { type: string, required: true }
  issue_number: { type: string, required: true }
  issue_title: { type: string, required: true }
  issue_url: { type: string, required: true }
  branch: { type: string, required: true }

nodes:
  # A read-only agent reads the issue first: it either writes the run's
  # contract (what the change must do, the files it will probably touch, its
  # risks) or asks on the issue and the run waits there, holding no slot,
  # until the issue changes. Takes `provider`, `model` and `effort` only.
  - id: triage
    triage: {}

  - id: implement
    depends_on: [triage]
    spawn_agent:
      # Shared with the other built-in factory flow (prompts/implement.md).
      prompt_file: prompts/implement.md

  - id: pull-request
    depends_on: [implement]
    create_pr:
      title: '{{issue_title}}'
    # The agent may finish without opening the pull request: ask it once.
    retry:
      max_attempts: 2
      should_retry: "$contains(error, 'did not open one')"
      before_retry:
        prompt_file: prompts/open-pr.md

  # Regression proof: see issue-to-merge.yaml for configuration examples.
  - id: regression-proof
    depends_on: [pull-request]
    regression_proof:
      require_test: always
      exempt_labels: [docs, chore]
      timeout_ms: 600000
    retry:
      max_attempts: 3
      should_retry: "$contains(error, 'Regression proof failed')"
      before_retry:
        prompt: |
          You are working unattended: nobody will answer questions.

          The regression proof of the pull request from `{{branch}}`
          (GitHub issue #{{issue_number}} of {{repo}}) failed:

          ```
          {{LAST_ERROR}}
          ```

          The test must fail without your fix and pass with it.
          Check out `{{branch}}` and pull it, fix the test, commit and
          push to `{{branch}}`. Do not open another pull request.
          End with a short summary of the fix.
